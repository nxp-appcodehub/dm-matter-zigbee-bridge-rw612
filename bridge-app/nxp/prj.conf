# This file is used to set configs or override default configurations for
# the Lighting On Off application.

CONFIG_CHIP=y
CONFIG_BT_DEVICE_NAME="\"NXP-AllClustersApp\""
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Bridge App"
CONFIG_CHIP_LIB_SHELL=y
CONFIG_CHIP_WIFI=y

CONFIG_MCUX_PRJSEG_module.board.boardfile=n
CONFIG_MCUX_COMPONENT_middleware.mbedtls.port.sssapi=n
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.seclib_rng_port.secure_subsystem=n
CONFIG_CHIP_USE_GENERATED_CONFIG=n
CONFIG_MCUX_COMPONENT_middleware.edgefast_bluetooth.porting_DEPEND_ANYOF_OPTION_1=y

CONFIG_configTOTAL_HEAP_SIZE=174080

# SDK configs
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.seclib_rng_port.mbedtls=y
CONFIG_MCUX_COMPONENT_utility.debug_console_lite=y
CONFIG_MCUX_PRJSEG_module.board.wireless.board.lowpower=y
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.platform.ot=y
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.lowpower=y
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.platform.lowpower_timer=y
CONFIG_MCUX_DEPENDENCY_COMPONENT_component.timer_manager_DEPEND_component.timer_manager_ctimer=y
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.pdm=y
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.pdum=y
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.platform.ota=y
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.ota_support=y
CONFIG_MCUX_COMPONENT_middleware.wireless.framework.file_system=y
CONFIG_MCUX_COMPONENT_middleware.wireless.ieee_802_15_4=y

# Zigbee 
CONFIG_MCUX_COMPONENT_middleware.wireless.zigbee=y
CONFIG_MCUX_COMPONENT_middleware.wireless.zigbee.coordinator=y
CONFIG_MCUX_COMPONENT_middleware.wireless.zigbee.features=y
CONFIG_MCUX_COMPONENT_middleware.wireless.zigbee.zcl_lighting=y